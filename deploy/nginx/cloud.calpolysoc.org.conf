# Drop into /etc/nginx/sites-available/cloud.calpolysoc.org and symlink:
#   ln -s /etc/nginx/sites-available/cloud.calpolysoc.org /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Adds the user-facing console at https://cloud.calpolysoc.org while the
# existing api.cloud.calpolysoc.org vhost continues to serve Floci + EC2 API.
#
# HTTPS is required because Auth.js / Keycloak SSO sets Secure cookies and
# Keycloak's redirect URI is registered as https://. Use an internal CA
# (or step-ca / Let's Encrypt DNS-01) to issue a cert for cloud.calpolysoc.org.

server {
    listen 80;
    listen [::]:80;
    server_name cloud.calpolysoc.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloud.calpolysoc.org;

    ssl_certificate     /etc/letsencrypt/live/cloud.calpolysoc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.calpolysoc.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Console is internal-only; allow VPN ranges only.
    allow 172.21.0.0/16;
    allow 100.64.0.0/10;   # Cloudflare WARP CGNAT
    allow 172.20.0.0/16;   # Docker bridge (server-side Auth.js calls)
    deny all;

    client_max_body_size 25m;

    # Keycloak id_tokens + Auth.js cookies make request headers larger than
    # nginx's default 8k. Must be set at server scope.
    large_client_header_buffers 4 16k;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Bump response-header buffers for the OIDC callback round-trip.
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;

        # Console proxies VM clone calls; keep generous timeouts.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
