name: Cloud checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - if: github.event_name == 'pull_request'
        run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend entry points without importing infrastructure clients
        run: python -m py_compile deploy/calpoly-cloud/ec2-api.py deploy/calpoly-cloud/ec2_wsgi.py deploy/calpoly-cloud/bootstrap-patch.py deploy/calpoly-cloud/cloudctl
      - name: Build deployable API image
        if: github.event_name == 'pull_request'
        run: docker build -t cloud-ec2api:check deploy/calpoly-cloud
